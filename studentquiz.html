<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Quiz | Online Quiz System</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="style.css">

    <style>
        .quiz-card {
            max-width: 850px;
        }

        .quiz-card-body {
            padding: 30px;
        }

        .quiz-overview {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            margin-bottom: 28px;
        }

        .quiz-category {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #475569;
            font-size: 14px;
            font-weight: 600;
        }

        .quiz-category i {
            color: #2563eb;
            font-size: 18px;
        }

        .timer-box {
            display: flex;
            align-items: center;
            gap: 9px;
            padding: 10px 14px;
            border: 1px solid #bfdbfe;
            border-radius: 10px;
            background: #eff6ff;
            color: #1d4ed8;
            font-size: 14px;
            font-weight: 700;
            white-space: nowrap;
        }

        .timer-box i {
            font-size: 17px;
        }

        .timer-box.timer-warning {
            border-color: #fecaca;
            background: #fef2f2;
            color: #dc2626;
        }

        .question-progress {
            height: 7px;
            margin-bottom: 26px;
            border-radius: 10px;
            background: #e2e8f0;
        }

        .question-progress .progress-bar {
            border-radius: 10px;
            background: #2563eb;
            transition: width 0.25s ease;
        }

        .question-count {
            color: #2563eb;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }

        .question-text {
            margin: 10px 0 22px;
            color: #172554;
            font-size: 21px;
            font-weight: 700;
            line-height: 1.5;
        }

        .answer-list {
            display: grid;
            gap: 12px;
        }

        .answer-option {
            display: flex;
            align-items: center;
            gap: 13px;
            min-height: 58px;
            padding: 14px 16px;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            background: #ffffff;
            color: #334155;
            cursor: pointer;
            transition: border-color 0.2s ease, background-color 0.2s ease;
        }

        .answer-option:hover {
            border-color: #93c5fd;
            background: #f8fbff;
        }

        .answer-option:has(input:checked) {
            border-color: #3b82f6;
            background: #eff6ff;
        }

        .answer-option input {
            width: 17px;
            height: 17px;
            margin: 0;
            accent-color: #2563eb;
            flex: 0 0 auto;
        }

        .answer-option input:focus-visible {
            outline: 3px solid rgba(37, 99, 235, 0.25);
            outline-offset: 3px;
        }

        .answer-option span {
            font-size: 14px;
            line-height: 1.5;
        }

        .quiz-message {
            min-height: 24px;
            margin: 18px 0 0;
            color: #64748b;
            font-size: 13px;
        }

        .quiz-message.completed {
            color: #15803d;
            font-weight: 600;
        }

        .quiz-message.expired {
            color: #dc2626;
            font-weight: 600;
        }

        .quiz-footer {
            justify-content: space-between;
            align-items: center;
        }

        .quiz-footer .btn:disabled {
            cursor: not-allowed;
            opacity: 0.55;
            transform: none;
            box-shadow: none;
        }

        @media (max-width: 767px) {
            .quiz-card-body {
                padding: 22px 20px;
            }

            .quiz-overview {
                align-items: flex-start;
            }

            .question-text {
                font-size: 18px;
            }

            .quiz-footer {
                flex-direction: row;
            }

            .quiz-footer .btn {
                width: auto;
                padding: 10px 14px;
            }
        }

        @media (max-width: 480px) {
            .quiz-overview {
                flex-direction: column;
            }

            .quiz-footer {
                flex-direction: column-reverse;
            }

            .quiz-footer .btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <main class="main-wrapper">
        <div class="container">
            <header class="page-header">
                <div>
                    <nav class="breadcrumb-text" aria-label="Breadcrumb">
                        <i class="bi bi-house-door" aria-hidden="true"></i>
                        <span>Dashboard</span>
                        <i class="bi bi-chevron-right" aria-hidden="true"></i>
                        <span>Quizzes</span>
                        <i class="bi bi-chevron-right" aria-hidden="true"></i>
                        <span class="active" aria-current="page">Student Quiz</span>
                    </nav>
                    <h1 class="page-title">Student Quiz</h1>
                    <p class="page-subtitle">Read each question carefully and choose the best answer.</p>
                </div>
                <div class="header-icon" aria-hidden="true">
                    <i class="bi bi-patch-question"></i>
                </div>
            </header>

            <section class="form-card quiz-card" aria-labelledby="quiz-card-title">
                <div class="form-card-header">
                    <div class="section-icon" aria-hidden="true">
                        <i class="bi bi-clipboard-check"></i>
                    </div>
                    <div>
                        <h2 id="quiz-card-title">HTML Fundamentals</h2>
                        <p>Choose one answer for each question.</p>
                    </div>
                </div>

                <div class="quiz-card-body">
                    <div class="quiz-overview">
                        <div class="quiz-category">
                            <i class="bi bi-tag" aria-hidden="true"></i>
                            <span>Category: Web Development</span>
                        </div>
                        <div class="timer-box" id="timerBox" role="timer" aria-label="Time remaining">
                            <i class="bi bi-clock" aria-hidden="true"></i>
                            <span id="timer">15:00</span>
                            <span>remaining</span>
                        </div>
                    </div>

                    <div class="progress question-progress" role="progressbar" aria-label="Quiz progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="20">
                        <div class="progress-bar" id="progressBar" style="width: 20%"></div>
                    </div>

                    <div id="questionPanel" aria-live="polite">
                        <p class="question-count" id="questionCount">Question 1 of 5</p>
                        <h3 class="question-text" id="questionText"></h3>
                        <div class="answer-list" id="answerList" role="radiogroup" aria-labelledby="questionText"></div>
                    </div>

                    <p class="quiz-message" id="quizMessage" role="status" aria-live="polite"></p>

                    <div class="form-footer quiz-footer">
                        <button type="button" class="btn btn-reset" id="previousButton" disabled>
                            <i class="bi bi-arrow-left"></i>
                            Previous
                        </button>
                        <button type="button" class="btn btn-save" id="nextButton">
                            Next
                            <i class="bi bi-arrow-right"></i>
                        </button>
                    </div>
                </div>
            </section>

            <footer class="page-footer">
                <p>© 2026 Online Quiz System. All rights reserved.</p>
            </footer>
        </div>
    </main>

    <script>
        const questions = [
            {
                text: "What does HTML stand for?",
                options: [
                    "HyperText Markup Language",
                    "HighText Machine Language",
                    "HyperTool Multi Language",
                    "HomeText Markup Language"
                ]
            },
            {
                text: "Which HTML element is used for the largest heading?",
                options: ["<heading>", "<h6>", "<h1>", "<head>"]
            },
            {
                text: "Which attribute provides alternative text for an image?",
                options: ["title", "src", "alt", "href"]
            },
            {
                text: "Which element creates a hyperlink?",
                options: ["<link>", "<a>", "<href>", "<url>"]
            },
            {
                text: "Which element is used to create an unordered list?",
                options: ["<ol>", "<li>", "<dl>", "<ul>"]
            }
        ];

        const answers = new Array(questions.length).fill(null);
        const timerElement = document.getElementById("timer");
        const timerBox = document.getElementById("timerBox");
        const questionCount = document.getElementById("questionCount");
        const questionText = document.getElementById("questionText");
        const answerList = document.getElementById("answerList");
        const progressBar = document.getElementById("progressBar");
        const progress = document.querySelector(".question-progress");
        const previousButton = document.getElementById("previousButton");
        const nextButton = document.getElementById("nextButton");
        const quizMessage = document.getElementById("quizMessage");

        let currentQuestion = 0;
        let secondsRemaining = 15 * 60;
        let quizEnded = false;

        function renderQuestion() {
            const question = questions[currentQuestion];
            questionCount.textContent = `Question ${currentQuestion + 1} of ${questions.length}`;
            questionText.textContent = question.text;
            answerList.replaceChildren();

            question.options.forEach((option, optionIndex) => {
                const label = document.createElement("label");
                label.className = "answer-option";

                const input = document.createElement("input");
                input.type = "radio";
                input.name = `question-${currentQuestion + 1}`;
                input.value = String(optionIndex);
                input.checked = answers[currentQuestion] === optionIndex;
                input.disabled = quizEnded;
                input.setAttribute("aria-label", option);
                input.addEventListener("change", () => {
                    answers[currentQuestion] = optionIndex;
                });

                const text = document.createElement("span");
                text.textContent = option;
                label.append(input, text);
                answerList.append(label);
            });

            const progressPercent = ((currentQuestion + 1) / questions.length) * 100;
            progressBar.style.width = `${progressPercent}%`;
            progress.setAttribute("aria-valuenow", String(progressPercent));
            previousButton.disabled = currentQuestion === 0 || quizEnded;
            nextButton.disabled = quizEnded;
            nextButton.innerHTML = currentQuestion === questions.length - 1
                ? 'Finish Quiz <i class="bi bi-check-circle"></i>'
                : 'Next <i class="bi bi-arrow-right"></i>';
        }

        function updateTimer() {
            const minutes = Math.floor(secondsRemaining / 60);
            const seconds = secondsRemaining % 60;
            timerElement.textContent = `${String(minutes).padStart(2, "0")}:${String(seconds).padStart(2, "0")}`;

            if (secondsRemaining <= 60) {
                timerBox.classList.add("timer-warning");
            }

            if (secondsRemaining === 0) {
                endQuiz(true);
                return;
            }

            secondsRemaining -= 1;
        }

        function endQuiz(timeExpired) {
            quizEnded = true;
            window.clearInterval(timerInterval);
            renderQuestion();
            const answeredCount = answers.filter((answer) => answer !== null).length;
            quizMessage.textContent = timeExpired
                ? `Time is up. You answered ${answeredCount} of ${questions.length} questions.`
                : `Quiz complete. You answered ${answeredCount} of ${questions.length} questions.`;
            quizMessage.className = `quiz-message ${timeExpired ? "expired" : "completed"}`;
        }

        previousButton.addEventListener("click", () => {
            if (currentQuestion > 0 && !quizEnded) {
                currentQuestion -= 1;
                renderQuestion();
                quizMessage.textContent = "";
                quizMessage.className = "quiz-message";
            }
        });

        nextButton.addEventListener("click", () => {
            if (currentQuestion < questions.length - 1) {
                currentQuestion += 1;
                renderQuestion();
                quizMessage.textContent = "";
                quizMessage.className = "quiz-message";
                return;
            }

            endQuiz(false);
        });

        renderQuestion();
        updateTimer();
        const timerInterval = window.setInterval(updateTimer, 1000);
    </script>
</body>
</html>
